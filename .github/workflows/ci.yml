name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      # target/ and the registry are cached; the last step trims target/ with this repo's own
      # action before the cache post-step saves it (dogfooding: the cache never grows)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --include-ignored
        timeout-minutes: 15
        env:
          RUST_BACKTRACE: "1"
      - name: use the binary the tests just built (no extra cargo install)
        if: always()
        shell: bash
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - uses: ./
        if: always()
        with:
          args: --verbose
  action:
    # the composite action on a real target: build, change the version (every unit rehashes),
    # build again, prune, and check that the next build compiles nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a throwaway copy, so the repository's own Cargo.toml is never touched: a different package
      # version there rehashes every unit, the way a dependency change does
      - run: cp -r . "$RUNNER_TEMP/copy" && cd "$RUNNER_TEMP/copy" && cargo build --all-targets
      - run: cd "$RUNNER_TEMP/copy" && sed -i 's/^version = ".*"/version = "9.9.9"/' Cargo.toml && cargo build --all-targets && du -sh target
      - uses: ./
        with:
          path: ${{ runner.temp }}/copy
          args: --verbose
      - name: nothing rebuilds after the prune
        run: |
          cd "$RUNNER_TEMP/copy" && du -sh target
          cargo build --all-targets 2>&1 | tee build.log
          ! grep -q Compiling build.log
