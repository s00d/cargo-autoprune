[package]
name = "cargo-autoprune"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "rustc-wrapper that keeps Cargo target/ dirs from growing: prunes superseded artifacts in the background after builds"
license = "MIT"
publish = false

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
