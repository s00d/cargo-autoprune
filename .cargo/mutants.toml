# cargo-mutants (`cargo install --locked cargo-mutants`): `cargo mutants`, or `cargo mutants --in-diff`
# on a branch. Every mutant is judged by the default suite (unit + e2e; the slow oracle tests stay
# ignored). Keep the default single job: the e2e tests run real cargo builds on every core.
#
# Known survivors on macOS/Linux (not excluded, so they stay visible):
# - prune: `m.is_dir()` guard -> true (files renamed into the trash instead of unlinked) and
#   `files.len() >= 1000` -> `<` (when a batch of unlinks is flushed): same result, only speed
# - wait_for_exit: `Instant::now() < deadline` -> `<=`: equal to the nanosecond
# - no_inherit_std_handles: Windows-only code, compiled out here (Windows CI runs the e2e tests)
timeout_multiplier = 3.0
minimum_test_timeout = 120
