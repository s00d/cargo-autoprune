[package]
name = "cargo-autoprune"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "rustc-wrapper that keeps Cargo target/ dirs from growing: prunes superseded artifacts in the background after builds"
license = "MIT"
repository = "https://github.com/s00d/cargo-autoprune"
homepage = "https://github.com/s00d/cargo-autoprune"
readme = "README.md"
keywords = ["cargo", "target", "clean", "disk-space", "build"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
exclude = [".github/", "scripts/", "action.yml"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
